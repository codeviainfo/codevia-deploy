# IP real del visitante detras de Cloudflare Tunnel.
# A este nginx solo llega cloudflared por la red interna de Docker, asi que
# nos fiamos de la cabecera CF-Connecting-IP que pone Cloudflare. Sin esto
# todas las visitas parecen venir del contenedor cloudflared y los frenos
# por IP (login de Cordoba Bets / Breakpoint, tracking del CRM) meten a
# todo el mundo en el mismo saco.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
