services:

  # ─────────────────────────────────────────────
  # Reparto por dominio (sin SSL propio).
  # Desde 2026-11 todo entra por Cloudflare Tunnel: el contenedor
  # `cloudflared` (stack ~/stacks/cloudflared) se une a codevia-proxy-net
  # y envia cada hostname a http://nginx-proxy:80. Cloudflare pone el
  # HTTPS, asi que ya no hay acme-companion ni puertos 80/443 abiertos.
  # 127.0.0.1:8088 solo sirve para probar desde la propia VM:
  #   curl -H "Host: crm.codeviaesp.com" http://127.0.0.1:8088/
  # ─────────────────────────────────────────────
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.6
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./vhost.d:/etc/nginx/vhost.d
      - ./cloudflare-realip.conf:/etc/nginx/conf.d/cloudflare-realip.conf:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - codevia-proxy-net

  # ─────────────────────────────────────────────
  # Landing page (codeviaesp.com + www)
  # ─────────────────────────────────────────────
  landing:
    container_name: codevia-landing
    build:
      context: ../codevia-landing
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: "${LANDING_DOMAIN},www.${LANDING_DOMAIN}"
      VIRTUAL_PORT: "80"
    networks:
      - codevia-proxy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────
  # Demos en vivo (subdominios de ejemplo, 100% estáticas)
  # Un único contenedor nginx sirve las 3 plantillas,
  # enrutadas por Host header (ver CODEVIA-DEMOS/nginx.conf).
  # ─────────────────────────────────────────────
  demos:
    container_name: codevia-demos
    build:
      context: ../CODEVIA-DEMOS
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: "${DEMO_RESTAURANTE_DOMAIN},${DEMO_CLINICA_DOMAIN},${DEMO_TIENDA_DOMAIN},${DEMO_ASESORIA_DOMAIN}"
      VIRTUAL_PORT: "80"
    networks:
      - codevia-proxy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────
  # CRM — Base de datos
  # ─────────────────────────────────────────────
  crm-db:
    image: postgres:16-alpine
    container_name: codevia-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - crm-postgres-data:/var/lib/postgresql/data
    networks:
      - codevia-proxy-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────
  # CRM — Backend API (no expuesto al exterior)
  # ─────────────────────────────────────────────
  crm-backend:
    container_name: codevia-crm-backend
    build:
      context: ../codeviacrm/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Chromium (scraper de Google Maps y render de Diseños) usa /dev/shm;
    # con los 64 MB por defecto de Docker puede cerrarse a media página.
    shm_size: 256m
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@codevia-crm-db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      # Opcional: proxies para el scraper de Google Maps, separados por coma.
      SCRAPER_PROXY_URLS: ${SCRAPER_PROXY_URLS:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      PORT: "4000"
      CANVA_CLIENT_ID: ${CANVA_CLIENT_ID}
      CANVA_CLIENT_SECRET: ${CANVA_CLIENT_SECRET}
      CANVA_REDIRECT_URI: ${CANVA_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: https://${CRM_DOMAIN}/api/google/callback
      APP_URL: https://${CRM_DOMAIN}
    depends_on:
      crm-db:
        condition: service_healthy
    networks:
      - codevia-proxy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────
  # CRM — Frontend (crm.codeviaesp.com)
  # El tráfico /api/* es redirigido al backend por
  # el override en vhost.d/crm.codeviaesp.com
  # ─────────────────────────────────────────────
  crm-frontend:
    container_name: codevia-crm-frontend
    build:
      context: ../codeviacrm/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${CRM_DOMAIN}/api
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: "${CRM_DOMAIN}"
      VIRTUAL_PORT: "5173"
    depends_on:
      crm-backend:
        condition: service_healthy
    networks:
      - codevia-proxy-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5173/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s


  # ─────────────────────────────────────────────
  # Portfolio de Hugo (hugo.codeviaesp.com)
  # Estático puro servido por nginx — ~6 MB de RAM.
  # ─────────────────────────────────────────────
  portfolio-hugo:
    container_name: codevia-portfolio-hugo
    build:
      context: ../CODEVIA-PORTFOLIO-HUGO
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: "${PORTFOLIO_HUGO_DOMAIN}"
      VIRTUAL_PORT: "80"
    networks:
      - codevia-proxy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  # ─────────────────────────────────────────────
  # Córdoba Bets — API (cordobabets.codeviaesp.com/api)
  # No se expone al proxy: solo la alcanza el nginx
  # del frontend, por la red interna de Docker.
  #
  # Comparte la instancia de PostgreSQL del CRM, pero
  # con base de datos propia: un motor menos en un VPS
  # de 1,6 GB. Hay que crearla una vez (ver README).
  # ─────────────────────────────────────────────
  cordobabets-api:
    container_name: cordobabets-api
    build:
      context: ../CORDOBA-BETS/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@codevia-crm-db:5432/${CORDOBABETS_DB}
      JWT_SECRET: ${CORDOBABETS_JWT_SECRET}
      SEED_ADMIN_EMAIL: ${CORDOBABETS_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${CORDOBABETS_ADMIN_PASSWORD}
      SEED_ADMIN_NOMBRE: ${CORDOBABETS_ADMIN_NOMBRE}
      TELEGRAM_BOT_TOKEN: ${CORDOBABETS_TELEGRAM_TOKEN:-}
      TELEGRAM_CANAL_ID: ${CORDOBABETS_TELEGRAM_CANAL:-}
      TELEGRAM_AVISOS_CHAT_ID: ${CORDOBABETS_TELEGRAM_AVISOS:-}
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      crm-db:
        condition: service_healthy
    networks:
      - codevia-proxy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/salud > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────
  # Córdoba Bets — Web (cordobabets.codeviaesp.com)
  # Estático servido por nginx (~6 MB de RAM) que
  # además hace de puerta de la API en /api/.
  # server_name literal en CORDOBA-BETS/frontend/nginx.conf.
  # ─────────────────────────────────────────────
  cordobabets-web:
    container_name: cordobabets-web
    build:
      context: ../CORDOBA-BETS/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: "${CORDOBABETS_DOMAIN}"
      VIRTUAL_PORT: "80"
    depends_on:
      cordobabets-api:
        condition: service_healthy
    networks:
      - codevia-proxy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────
  # Breakpoint Tennis — API (breakpoint.codeviaesp.com)
  # Mismo patron que Cordoba Bets: no se expone al proxy, solo la alcanza el
  # nginx de breakpoint-web. Base propia (BREAKPOINT_DB) en el PostgreSQL del CRM.
  # La contrasena del panel NO va en el .env: se pasa una sola vez al sembrar
  #   docker compose exec -e SEED_ADMIN_PASSWORD='...' breakpoint-api npm run seed
  # ─────────────────────────────────────────────
  breakpoint-api:
    container_name: breakpoint-api
    build:
      context: ../BREAKPOINT-TENNIS/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@codevia-crm-db:5432/${BREAKPOINT_DB}
      JWT_SECRET: ${BREAKPOINT_JWT_SECRET}
      SEED_ADMIN_EMAIL: ${BREAKPOINT_ADMIN_EMAIL}
      SEED_ADMIN_NOMBRE: ${BREAKPOINT_ADMIN_NOMBRE}
      TELEGRAM_BOT_TOKEN: ${BREAKPOINT_TELEGRAM_TOKEN:-}
      TELEGRAM_CANAL_ID: ${BREAKPOINT_TELEGRAM_CANAL:-}
      TELEGRAM_AVISOS_CHAT_ID: ${BREAKPOINT_TELEGRAM_AVISOS:-}
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      crm-db:
        condition: service_healthy
    networks:
      - codevia-proxy-net
    deploy:
      resources:
        limits:
          memory: 192M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/salud > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────
  # Breakpoint Tennis — Web (breakpoint.codeviaesp.com)
  # nginx con los estaticos, que ademas reenvia /api/ a breakpoint-api.
  # server_name literal en BREAKPOINT-TENNIS/frontend/nginx.conf.
  # ─────────────────────────────────────────────
  breakpoint-web:
    container_name: breakpoint-web
    build:
      context: ../BREAKPOINT-TENNIS/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: "${BREAKPOINT_DOMAIN}"
      VIRTUAL_PORT: "80"
    depends_on:
      breakpoint-api:
        condition: service_healthy
    networks:
      - codevia-proxy-net
    deploy:
      resources:
        limits:
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  codevia-proxy-net:
    name: codevia-proxy-net

volumes:
  crm-postgres-data:
